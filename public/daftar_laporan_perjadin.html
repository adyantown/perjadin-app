<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/kpu_logo.png">
    <title>Daftar Laporan Perjadin - KPU Tubaba</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <link rel="stylesheet" href="style/perjadin-style.css">
    <link rel="stylesheet" href="style/index-style.css">
</head>

<body style="background-color: #f4f6f9;">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-kpu py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-arrow-left-circle me-2"></i> Kembali ke Dashboard
            </a>
            <span class="text-white fw-bold d-none d-md-block">DAFTAR LAPORAN PERJADIN</span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <h4 class="fw-bold m-0" style="color: var(--kpu-dark);">Daftar Laporan Perjalanan Dinas</h4>
                        <small class="text-muted">Cetak dan tinjau kembali laporan kegiatan dinas yang telah disusun.</small>
                    </div>
                    <a href="/laporan_perjadin.html" class="btn btn-danger text-white shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Buat Laporan Baru
                    </a>
                </div>

                <div class="table-responsive">
                    <table id="tableLaporan" class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th width="5%">No</th>
                                <th>No. Surat Tugas</th>
                                <th>Tujuan Kegiatan</th>
                                <th>Waktu Laporan</th>
                                <th width="15%" class="text-center"><i class="bi bi-gear-fill"></i> Opsi</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyLaporan">
                            <!-- Data dimuat lewat JS -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/daftar-laporan-handler.js"></script>
</body>

</html>
