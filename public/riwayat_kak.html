<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat KAK - E-Perjadin KPU Tubaba</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-kpu {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-kpu py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">
                <i class="bi bi-wallet2 me-2"></i>E-Perjadin KPU Tubaba
            </a>
            <div class="d-flex gap-2">
                <a href="/input_kak.html"
                    class="btn btn-sm btn-light text-warning fw-bold rounded-pill px-3">
                    <i class="bi bi-plus-circle me-1"></i> Buat KAK Baru
                </a>
                <a href="/index.html" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    Kembali
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm border-0 rounded-4 mb-5">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                <h5 class="fw-bold text-secondary"><i class="bi bi-journal-text me-2"></i>Daftar
                    Riwayat KAK</h5>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center" width="5%">No</th>
                                <th width="15%">Tanggal KAK</th>
                                <th width="35%">Judul Kegiatan</th>
                                <th width="20%">Beban Anggaran</th>
                                <th class="text-center" width="25%">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelBodyKak">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"
                                        role="status"></div> Memuat data KAK...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // SCRIPT LANGSUNG DITANAM DI SINI BIAR CEPAT
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('tabelBodyKak');

            try {
                const response = await fetch('/api/kak/all');
                const data = await response.json();

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Belum ada KAK yang dibuat.</td></tr>`;
                    return;
                }

                tbody.innerHTML = ''; // Kosongkan loading
                data.forEach((item, index) => {
                    // Format tanggal biar cantik (YYYY-MM-DD -> DD-MM-YYYY)
                    const tgl = new Date(item.tgl_kak).toLocaleDateString('id-ID');

                    const row = `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td><span class="badge bg-light text-dark border"><i class="bi bi-calendar-event me-1"></i> ${tgl}</span></td>
                            <td class="fw-bold text-secondary">${item.judul_kegiatan}</td>
                            <td><small class="text-muted"><i class="bi bi-tags me-1"></i> ${item.nama_kamar || 'Kamar Tidak Diketahui'}</small></td>
                            <td class="text-center">
                                <a href="/cetak_kak.html?id=${item.id}" target="_blank" class="btn btn-sm btn-outline-success rounded-pill px-3 shadow-sm me-1">
                                    <i class="bi bi-printer-fill me-1"></i> Cetak
                                </a>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Error load KAK:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Gagal memuat data dari server.</td></tr>`;
            }
        });
    </script>
</body>

</html>
