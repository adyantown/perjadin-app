<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat KAK - E-Perjadin KPU Tubaba</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-kpu {
            background: linear-gradient(135deg, #800000 0%, #bb2d3b 100%);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-kpu py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">
                <img src="img/kpu_logo.png" alt="Logo KPU" height="50" class="me-3"></i>Kerangka
                Acuan Kerja (KAK)
            </a>
            <div class="d-flex gap-2">
                <a href="/input_kak.html"
                    class="btn btn-sm btn-light text-danger fw-bold rounded-pill px-3">
                    <i class="bi bi-plus-circle me-1"></i> Buat KAK Baru
                </a>
                <a href="/index.html" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    Kembali
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm border-0 rounded-4 mb-5">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                <h5 class="fw-bold text-secondary"><i class="bi bi-journal-text me-2"></i>Daftar
                    Riwayat KAK</h5>
                <p class="mb-0 text-muted">Arsip Kerangka Acuan Kerja</p>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center" width="5%">No</th>
                                <th width="15%">Tanggal KAK</th>
                                <th width="35%">Judul Kegiatan</th>
                                <th width="20%">Beban Anggaran</th>
                                <th class="text-center" width="25%">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelBodyKak">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"
                                        role="status"></div> Memuat data KAK...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/riwayat-kak-handler.js"></script>
    <script src="/js/load-components.js"></script>
</body>

</html>
