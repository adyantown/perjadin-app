<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/kpu_logo.png">
    <title>Input Perjadin - KPU Tubaba</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <div class="container">
        <h2>Form Perjalanan Dinas (SPPD)</h2>
        <div style="margin-bottom: 20px;">
            <a href="/daftar.html"
                style="color: #800000; font-weight: bold; text-decoration: none;">📂
                Lihat Daftar Perjadin >></a>
        </div>
        <form id="perjadinForm">
            <input type="hidden" name="id_edit" id="id_edit">
            <div class="form-group-title">I. Administrasi Surat Tugas</div>
            <div class="grid">
                <div>
                    <label>No. Surat Tugas</label>
                    <input type="text" name="no_surat_tugas" placeholder="Contoh: 001/ST/KPU..."
                        required>
                </div>
                <div>
                    <label>Tanggal Surat Tugas</label>
                    <input type="date" name="tgl_surat_tugas" required>
                </div>
            </div>

            <div class="form-group-title">II. Data Pegawai</div>
            <div id="pegawai-container">
                <div class="grid pegawai-row"
                    style="margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;">
                    <div>
                        <label>Nama Pegawai</label>
                        <input type="text" name="nama_pegawai[]" required>
                    </div>
                    <div>
                        <label>Golongan</label>
                        <input type="text" name="golongan[]" placeholder="Contoh: IV/a">
                    </div>
                    <div>
                        <label>Jabatan</label>
                        <input type="text" name="jabatan[]" required>
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button type="button" class="btn-remove" onclick="hapusBaris(this)"
                            style="background:#e74c3c; width:auto; margin:0; padding: 8px 15px; display:none;">Hapus</button>
                    </div>
                </div>
            </div>

            <button type="button" onclick="tambahPegawai()" class="btn btn-add">+
                Tambah Pegawai
                Lain</button>

            <div class="form-group-title">III. Detail Perjalanan</div>
            <label>Maksud Perjalanan Dinas</label>
            <textarea name="maksud_dinas" rows="2" required></textarea>
            <div class="grid">
                <div>
                    <label>Daerah Tujuan</label>
                    <input type="text" name="tujuan" required>
                </div>
                <div>
                    <label>Transportasi</label>
                    <select name="jenis_transportasi">
                        <option value="Kendaraan Dinas/Pribadi">Kendaraan Dinas/Pribadi (BBM)
                        </option>
                        <option value="Angkutan Umum">Angkutan Umum (Tiket)</option>
                    </select>
                </div>
                <div>
                    <label>Tanggal Berangkat</label>
                    <input type="date" name="tgl_berangkat" id="tgl_berangkat" required>
                </div>
                <div>
                    <label>Tanggal Pulang</label>
                    <input type="date" name="tgl_pulang" id="tgl_pulang" required>
                </div>
            </div>

            <div class="form-group-title">IV. Biaya & Akomodasi</div>
            <div class="grid">
                <div>
                    <label>Uang Harian (Per Hari)</label>
                    <input type="number" name="uang_harian" placeholder="Rp" required>
                </div>
                <div>
                    <label>Biaya Transport (BBM/Tiket)</label>
                    <input type="number" name="biaya_transportasi" placeholder="Rp" value="0">
                </div>
            </div>
            <p style="margin-top:15px; font-weight:bold; color:#800000;">Data Hotel (Jika Menginap):
            </p>
            <div class="grid">
                <div style="grid-column: span 2;">
                    <label>Nama Hotel</label>
                    <input type="text" name="nama_hotel" placeholder="Nama Hotel">
                </div>
                <div>
                    <label>Tarif Per Malam</label>
                    <input type="number" name="tarif_hotel" placeholder="Rp" value="0">
                </div>
                <div>
                    <label>Check-in</label>
                    <input type="date" name="tgl_checkin">
                </div>
                <div style="grid-column: start 2;">
                    <label>Check-out</label>
                    <input type="date" name="tgl_checkout">
                </div>
            </div>
            <div
                style="background: #fff8e1; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #ffda44;">
                <p style="margin: 0; font-size: 14px; color: #555;">Estimasi Total Biaya:</p>
                <h3 id="preview-total" style="margin: 5px 0 0 0; color: #800000;">Rp 0</h3>
            </div>
            <button type="submit" class="btn btn-submit">Simpan Data Perjadin</button>
        </form>
    </div>
    <script>
        // --- 1. FUNGSI HELPER & FORMATTING ---
        function bersihAngka(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/\./g, '').replace(/[^0-9.-]+/g, "")) || 0;
        }

        function formatRupiah(angka) {
            let number_string = angka.replace(/[^,\d]/g, '').toString(),
                split = number_string.split(','),
                sisa = split[0].length % 3,
                rupiah = split[0].substr(0, sisa),
                ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            return rupiah;
        }

        // --- 2. LOGIKA HITUNG OTOMATIS ---
        function hitungOtomatis() {
            try {
                const rows = document.querySelectorAll('.pegawai-row');
                const jumlahPegawai = rows.length;

                const uangHarian = bersihAngka(document.querySelector('[name="uang_harian"]').value);
                const biayaTrans = bersihAngka(document.querySelector('[name="biaya_transportasi"]').value);
                const tarifHotel = bersihAngka(document.querySelector('[name="tarif_hotel"]').value);

                const tglB = document.querySelector('[name="tgl_berangkat"]').value;
                const tglP = document.querySelector('[name="tgl_pulang"]').value;
                const tglIn = document.querySelector('[name="tgl_checkin"]').value;
                const tglOut = document.querySelector('[name="tgl_checkout"]').value;

                let durasiPerjadin = 0;
                if (tglB && tglP) {
                    const d1 = new Date(tglB);
                    const d2 = new Date(tglP);
                    if (d2 >= d1) durasiPerjadin = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                }

                let malamInap = 0;
                if (tglIn && tglOut) {
                    const c1 = new Date(tglIn);
                    const c2 = new Date(tglOut);
                    if (c2 >= c1) malamInap = Math.ceil((c2 - c1) / (1000 * 60 * 60 * 24));
                }

                const totalHarian = (uangHarian * durasiPerjadin) * jumlahPegawai;
                const totalHotel = tarifHotel * malamInap;
                const grandTotal = totalHarian + biayaTrans + totalHotel;

                document.getElementById('preview-total').innerText = 'Rp ' + grandTotal.toLocaleString('id-ID');
            } catch (err) { console.error("Hitung error:", err); }
        }

        // --- 3. MANIPULASI BARIS PEGAWAI ---
        function tambahPegawai(nama = '', gol = '', jab = '') {
            const container = document.getElementById('pegawai-container');
            const htmlBaris = `
                <div class="grid pegawai-row" style="margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;">
                    <div>
                        <label>Nama Pegawai</label>
                        <input type="text" name="nama_pegawai[]" value="${nama}" required>
                    </div>
                    <div>
                        <label>Golongan</label>
                        <input type="text" name="golongan[]" value="${gol}" placeholder="Contoh: IV/a">
                    </div>
                    <div>
                        <label>Jabatan</label>
                        <input type="text" name="jabatan[]" value="${jab}" required>
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button type="button" class="btn-remove" onclick="hapusBaris(this)" 
                            style="background:#e74c3c; width:auto; margin:0; padding: 8px 15px;">Hapus</button>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', htmlBaris);
            updateTombolHapus();
            hitungOtomatis();
        }

        function hapusBaris(btn) {
            btn.closest('.pegawai-row').remove();
            updateTombolHapus();
            hitungOtomatis();
        }

        function updateTombolHapus() {
            const rows = document.querySelectorAll('.pegawai-row');
            rows.forEach(row => {
                row.querySelector('.btn-remove').style.display = rows.length === 1 ? 'none' : 'block';
            });
        }

        // --- 4. MODE EDIT ---
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        const formatDate = (d) => (d && d !== "null" && !d.startsWith("0000") && !d.startsWith("1899")) ? d.split('T')[0] : '';

        if (editId) {
            document.querySelector('h2').innerText = "Edit Data Perjalanan Dinas";
            fetch(`/api/get-perjadin/${editId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('id_edit').value = editId;
                    document.getElementsByName('no_surat_tugas')[0].value = data.no_surat_tugas;
                    document.getElementsByName('tgl_surat_tugas')[0].value = formatDate(data.tgl_surat_tugas);
                    document.getElementsByName('maksud_dinas')[0].value = data.maksud_dinas;
                    document.getElementsByName('tujuan')[0].value = data.tujuan;
                    document.getElementsByName('jenis_transportasi')[0].value = data.jenis_transportasi;
                    document.getElementsByName('tgl_berangkat')[0].value = formatDate(data.tgl_berangkat);
                    document.getElementsByName('tgl_pulang')[0].value = formatDate(data.tgl_pulang);

                    // Format angka saat load
                    document.getElementsByName('uang_harian')[0].value = formatRupiah((data.uang_harian || 0).toString());
                    document.getElementsByName('biaya_transportasi')[0].value = formatRupiah((data.biaya_transportasi || 0).toString());
                    document.getElementsByName('tarif_hotel')[0].value = formatRupiah((data.tarif_hotel || 0).toString());

                    document.getElementsByName('nama_hotel')[0].value = data.nama_hotel || '';
                    document.getElementsByName('tgl_checkin')[0].value = formatDate(data.tgl_checkin);
                    document.getElementsByName('tgl_checkout')[0].value = formatDate(data.tgl_checkout);

                    const container = document.getElementById('pegawai-container');
                    container.innerHTML = '';
                    const namaArr = data.nama_pegawai ? data.nama_pegawai.split(', ') : [''];
                    const golArr = data.golongan ? data.golongan.split(', ') : [''];
                    const jabArr = data.jabatan ? data.jabatan.split(', ') : [''];

                    namaArr.forEach((n, i) => tambahPegawai(n, golArr[i] || '', jabArr[i] || ''));
                    setTimeout(hitungOtomatis, 300);
                });
        }

        // --- 5. EVENT LISTENERS ---
        document.addEventListener('input', (e) => {
            if (e.target.name === 'uang_harian' || e.target.name === 'biaya_transportasi' || e.target.name === 'tarif_hotel') {
                e.target.value = formatRupiah(e.target.value);
            }
            hitungOtomatis();
        });

        // --- 6. PROSES SIMPAN (SOLUSI NAMA HILANG) ---
        document.getElementById('perjadinForm').onsubmit = async function (e) {
            e.preventDefault();

            // Gunakan URLSearchParams secara manual agar array [] terkirim dengan benar
            const formData = new FormData(this);
            const searchParams = new URLSearchParams();

            for (const pair of formData.entries()) {
                searchParams.append(pair[0], pair[1]);
            }

            try {
                const response = await fetch('/api/save-perjadin', {
                    method: 'POST',
                    body: searchParams // Mengirim data yang sudah mendukung multiple values
                });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    window.location.href = '/daftar.html';
                } else {
                    alert("Gagal: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Koneksi ke server terputus.");
            }
        };
    </script>

</body>

</html>
