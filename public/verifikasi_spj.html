<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meja Verifikasi SPJ - E-Perjadin</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style/index-style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Warna Hijau Tua Khas Verifikator */
        .navbar-verif {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-verif py-3 shadow-sm mb-4">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/index.html">
                <i class="bi bi-shield-check me-2 fs-3"></i>
                <div>
                    Meja Verifikasi SPJ
                    <small class="d-block fw-normal" style="font-size: 11px; opacity: 0.8;">Ruang
                        Kerja Admin / Verifikator</small>
                </div>
            </a>
            <a href="/index.html" class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Dashboard
            </a>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <h4 class="fw-bold text-dark mb-1"><i
                        class="bi bi-inboxes-fill text-success me-2"></i>Antrean Dokumen Masuk</h4>
                <p class="text-muted small mb-0">Verifikasi kelengkapan bukti laporan, tiket, dan
                    kuitansi penginapan pegawai.</p>
            </div>
            <button onclick="loadAntrean()"
                class="btn btn-sm btn-light border shadow-sm rounded-pill px-3">
                <i class="bi bi-arrow-clockwise text-primary"></i> Refresh
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4 py-3" width="15%">Waktu Upload</th>
                                <th width="35%">Pelaksana & Kegiatan</th>
                                <th class="text-center" width="15%">Berkas SPJ</th>
                                <th class="text-center" width="15%">Status</th>
                                <th class="text-center" width="20%">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="tabelVerifikasi">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-5">
                                    <div class="spinner-border spinner-border-sm me-2"></div>Memuat
                                    antrean dokumen...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/verifikasi-handler.js"></script>
</body>

</html>
