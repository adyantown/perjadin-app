    <style>
        body {
            background-color: #525659;
            font-family: Cambria, Georgia, serif;
            font-size: 11pt;
        }

        /* === KERTAS PREVIEW DI LAYAR === */
        .halaman {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 1cm 1.5cm;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* === HEADER KOP SURAT === */
        .header-cetak-wrapper img {
            display: block;
            margin: 0;
        }

        .header-cetak-wrapper .col-7 .d-flex {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* === TABEL UTAMA HALAMAN DEPAN === */
        .table-sppd-main {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        .table-sppd-main>tbody>tr>td,
        .table-sppd-main>tr>td {
            border: 1px solid black;
            padding: 4px;
            vertical-align: top;
        }

        /* === TABEL HALAMAN BELAKANG === */
        .table-belakang {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            margin-top: 5px;
        }

        .table-belakang td {
            border: 1px solid black;
            padding: 2px 4px;
            vertical-align: top;
            width: 50%;
            line-height: 1.15;
        }

        .box-ttd {
            height: 35px;
        }

        hr {
            border-top: 2px solid black !important;

        }

        /* === TABEL PENGIKUT (NESTED) === */
        .table-sppd-main .nested-table td {
            border: none;
            padding: 4px 6px;
        }

        .garis-kanan {
            border-right: 1px solid black !important;
        }

        .garis-bawah {
            border-bottom: 1px solid black !important;
        }

        .td-container-8 {
            padding: 0 !important;
            border: 1px solid black !important;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm 15mm;
            }

            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;

            }

                display: none !important;
            }

                width: 100%;
                min-height: auto;
                height: auto;
                margin: 0;
                padding: 0;
                box-shadow: none;

            }

                        </div>
                        `;
                    });

                    container.innerHTML = allHTML;
                }
            } catch (err) {
                console.error('Gagal cetak SPPD:', err);
                alert('Terjadi kesalahan sistem.');
            }
        });
    </script>
