<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit KAK - E-Perjadin KPU Tubaba</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Sedikit pemanis tambahan biar makin KPU banget */
        body {
            background-color: #f8f9fa;
        }

        .navbar-kpu {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-kpu py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">
                <i class="bi bi-wallet2 me-2"></i>E-Perjadin KPU Tubaba
            </a>
            <a href="/index.html"
                class="btn btn-sm btn-light text-warning fw-bold rounded-pill px-3">
                <i class="bi bi-house-door-fill me-1"></i> Beranda
            </a>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold text-secondary mb-1">📝 Edit Kerangka Acuan Kerja (KAK)</h4>
                <p class="mb-0 text-muted">Perubahan Perencanaan Kegiatan dan Anggaran SPPD</p>
            </div>
            <a href="/riwayat_kak.html"
                class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Riwayat
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-5">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                <h5 class="fw-bold text-warning"><i class="bi bi-pencil-square me-2"></i>Formulir
                    Edit KAK</h5>
            </div>
            <div class="card-body p-4">
                <form id="formEditKak">
                    <input type="hidden" id="kak_id" name="id">

                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <label class="form-label fw-bold text-secondary">Pembebanan Anggaran
                                (DIPA) <span class="text-danger">*</span></label>
                            <select name="pagu_id" id="pagu_id"
                                class="form-select form-select-lg border-warning bg-light shadow-sm"
                                required>
                                <option value="">-- Sedang memuat brankas anggaran... --</option>
                            </select>
                            <small class="text-muted" id="infoPagu"><i
                                    class="bi bi-info-circle me-1"></i>Pilih sumber dana yang akan
                                digunakan untuk kegiatan ini.</small>
                        </div>

                        <div class="col-md-12 mt-4">
                            <label class="form-label fw-bold text-secondary">Judul Kegiatan <span
                                    class="text-danger">*</span></label>
                            <input type="text" id="judul_kegiatan" name="judul_kegiatan"
                                class="form-control form-control-lg shadow-sm"
                                placeholder="Contoh: Melaksanakan Pencocokan dan Penelitian Terbatas..."
                                required>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25 mb-4">

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">1. Latar Belakang /
                                Pendahuluan</label>
                            <textarea id="latar_belakang" name="latar_belakang"
                                class="form-control shadow-sm" rows="5"
                                placeholder="Ketikan latar belakang kegiatan di sini..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">2. Dasar Hukum</label>
                            <textarea id="dasar_hukum" name="dasar_hukum"
                                class="form-control shadow-sm bg-light" rows="5"
                                required></textarea>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">3. Maksud dan
                                Tujuan</label>
                            <textarea id="maksud_tujuan" name="maksud_tujuan"
                                class="form-control shadow-sm" rows="4"
                                placeholder="Tujuan pelaksanaan kegiatan ini adalah..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">4. Output yang
                                Dicapai</label>
                            <textarea id="output_kegiatan" name="output_kegiatan"
                                class="form-control shadow-sm" rows="4"
                                placeholder="Output dari kegiatan ini yaitu..."></textarea>
                        </div>
                    </div>

                    <hr class="text-muted opacity-25 mb-4">

                    <div class="row g-3 mb-4 bg-light border p-3 rounded-4 shadow-sm">
                        <div class="col-12 mb-2">
                            <h6 class="fw-bold text-secondary m-0"><i
                                    class="bi bi-pen me-2"></i>Otorisasi Dokumen</h6>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">Tanggal
                                KAK</label>
                            <input type="date" id="tgl_kak" name="tgl_kak" class="form-control"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">Pejabat Pembuat
                                Komitmen</label>
                            <input type="text" id="ppk_nama" name="ppk_nama"
                                class="form-control bg-white text-muted fw-bold" readonly required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">NIP PPK</label>
                            <input type="text" id="ppk_nip" name="ppk_nip"
                                class="form-control bg-white text-muted" readonly required>
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit"
                            class="btn btn-warning text-dark px-5 fw-bold shadow-sm rounded-pill">
                            <i class="bi bi-save me-1"></i> Simpan Perubahan KAK
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Ambil ID KAK dari URL (misal: /edit_kak.html?id=5)
            const urlParams = new URLSearchParams(window.location.search);
            const kakId = urlParams.get('id');

            if (!kakId) {
                Swal.fire('Error', 'ID KAK tidak ditemukan!', 'error').then(() => window.location.href = '/riwayat_kak.html');
                return;
            }

            document.getElementById('kak_id').value = kakId;

            // 2. Tarik Data Pagu Anggaran untuk Dropdown
            try {
                const resPagu = await fetch('/api/pagu/all');
                const jsonPagu = await resPagu.json();
                const selectPagu = document.getElementById('pagu_id');

                selectPagu.innerHTML = '<option value="">-- Pilih Pagu Beban Anggaran --</option>';
                if (jsonPagu.success && jsonPagu.data) {
                    jsonPagu.data.forEach((pagu) => {
                        // Pakai parseInt biar nggak jadi ratusan juta
                        const sisaRupiah = parseInt(pagu.sisa_pagu).toLocaleString('id-ID');
                        selectPagu.innerHTML += `<option value="${pagu.id}">${pagu.nama_kamar} (Sisa: Rp ${sisaRupiah})</option>`;
                    });
                }
            } catch (err) {
                console.error('Gagal meload Pagu:', err);
            }

            // 3. Tarik Data KAK Lama dari Database
            try {
                const resKak = await fetch(`/api/kak/view/${kakId}`);
                const jsonKak = await resKak.json();

                if (jsonKak.success && jsonKak.data) {
                    const k = jsonKak.data;
                    document.getElementById('judul_kegiatan').value = k.judul_kegiatan;

                    // Format tanggal biar bisa masuk ke input type="date"
                    const tgl = new Date(k.tgl_kak).toISOString().split('T')[0];
                    document.getElementById('tgl_kak').value = tgl;

                    document.getElementById('pagu_id').value = k.pagu_id;
                    document.getElementById('latar_belakang').value = k.latar_belakang;
                    document.getElementById('maksud_tujuan').value = k.maksud_tujuan;
                    document.getElementById('output_kegiatan').value = k.output_kegiatan;
                    document.getElementById('dasar_hukum').value = k.dasar_hukum;
                    document.getElementById('ppk_nama').value = k.ppk_nama;
                    document.getElementById('ppk_nip').value = k.ppk_nip;
                } else {
                    Swal.fire('Error', 'Data KAK tidak ditemukan', 'error');
                }
            } catch (err) {
                console.error('Gagal meload KAK lama:', err);
                Swal.fire('Error', 'Gagal menghubungi server', 'error');
            }
        });

        // 4. Proses Submit Edit
        document.getElementById('formEditKak').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const kakId = document.getElementById('kak_id').value;

            try {
                Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

                const response = await fetch(`/api/kak/update/${kakId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Data KAK telah diubah.',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = '/riwayat_kak.html';
                    });
                } else {
                    Swal.fire('Gagal!', result.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'Terjadi kesalahan sistem saat menyimpan KAK.', 'error');
            }
        });
    </script>
</body>

</html>
