<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat SPPD - KPU Tubaba</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        :root {
            --kpu-red: #bb2d3b;
            --kpu-dark: #a52835;
        }

        .bg-kpu {
            background-color: var(--kpu-red) !important;
            color: white;
        }

        .btn-kpu {
            background-color: var(--kpu-red);
            color: white;
            border: none;
        }

        .btn-kpu:hover {
            background-color: var(--kpu-dark);
            color: white;
        }

        table thead {
            background-color: #f8f9fa;
        }

        .badge-status {
            font-size: 0.8em;
            padding: 5px 10px;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-kpu shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="index.html">
                <img src="img/kpu_logo.png" width="30" height="30"
                    class="d-inline-block align-top me-2">
                ARSIP SPPD
            </a>
            <div class="d-flex">
                <a href="/input_sppd.html" class="btn btn-light btn-sm fw-bold text-danger">
                    + Buat SPPD Baru
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="m-0 fw-bold text-secondary">Data Riwayat Surat Perjalanan Dinas</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="🔍 Cari Nomor Surat atau Nama Pegawai...">
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>No. Surat</th>
                                <th>Tanggal</th>
                                <th>Pegawai Ditugaskan</th>
                                <th>Tujuan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelRiwayat">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/riwayat-sppd-handler.js"></script>
</body>

</html>
