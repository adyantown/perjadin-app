<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login E-PERJADIN</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #800000 0%, #bb2d3b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .btn-login {
            background-color: #800000;
            color: white;
            font-weight: bold;
            padding: 12px;
        }

        .btn-login:hover {
            background-color: #5a0000;
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-card text-center">
        <img src="img/kpu_logo.png" width="80" class="mb-3">
        <h4 class="fw-bold text-secondary">E-PERJADIN</h4>
        <p class="text-muted small mb-4">Sistem Informasi Perjalanan Dinas<br>KPU Kab. Tulang Bawang
            Barat</p>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username"
                    required>
                <label for="username"><i class="bi bi-person me-2"></i>Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password"
                    required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            </div>
            <button type="submit" class="btn btn-login w-100 rounded-3">MASUK APLIKASI</button>
        </form>

        <div class="mt-4 text-muted small">
            &copy; 2026 KPU Tubaba | Ady Nugroho
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Cek apakah di URL ada tulisan "?alert=belum_login"
            const urlParams = new URLSearchParams(window.location.search);
            const alertType = urlParams.get('alert');

            if (alertType === 'belum_login') {
                // 2. Munculkan Alert Keras!
                Swal.fire({
                    icon: 'warning',
                    title: 'Mohon Maaf',
                    text: 'Anda harus LOGIN dulu sebelum masuk ke sistem!',
                    confirmButtonColor: '#800000'
                });

                // 3. (Opsional) Bersihkan URL biar rapi lagi
                window.history.replaceState({}, document.title, "/login.html");
            }

        });
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.querySelector('button');

            // Efek loading
            btn.innerHTML = 'Memeriksa...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();

                if (data.success) {
                    // Login Berhasil!
                    localStorage.setItem('user_kpu', JSON.stringify(data.user)); // Simpan info user

                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil!',
                        text: 'Selamat datang di E-PERJADIN',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/index.html'; // Pindah ke Dashboard
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Gagal',
                        text: data.message,
                        confirmButtonColor: '#800000'
                    });
                    btn.innerHTML = 'MASUK APLIKASI';
                    btn.disabled = false;
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Bermasalah',
                    text: 'Terjadi kesalahan saat terhubung ke server.',
                    confirmButtonColor: '#800000'
                });
                btn.innerHTML = 'MASUK APLIKASI';
                btn.disabled = false;
            }
        });

    </script>
</body>

</html>
