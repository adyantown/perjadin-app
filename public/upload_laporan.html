<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload SPJ - E-Perjadin</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-kpu {
            background: linear-gradient(135deg, #800000 0%, #bb2d3b 100%);
        }

        .btn-merah-terang {
            background-color: #e00000 !important;
            color: white !important;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-merah-terang:hover {
            background-color: #800000 !important;
            color: white !important;
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #e9ecef 25%, #f8f9fa 50%, #e9ecef 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
            border-radius: 6px;
            height: 14px;
            display: inline-block;
        }

        .skeleton-line {
            height: 12px;
            margin-bottom: 8px;
        }

        .skeleton-badge {
            width: 70px;
            height: 26px;
            border-radius: 50px;
        }

        .skeleton-btn {
            width: 80px;
            height: 30px;
            border-radius: 50px;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark navbar-kpu py-3 shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/index.html">
                <img src="img/kpu_logo.png" alt="Logo KPU" height="50" class="me-3"></i>Laporan
                Kegiatan Perjalan Dinas
            </a>
            <a href="/index.html" class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold">
                <i class="bi bi-house-door-fill me-1"></i> Kembali ke Dashboard
            </a>

    </nav>


    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h5 class="fw-bold text-dark"><i
                                class="bi bi-cloud-arrow-up-fill text-primary me-2"></i>Upload Bukti
                            SPJ (PDF)</h5>
                        <p class="text-muted small mb-0">Upload berkas laporan, tiket, dan kuitansi
                            hotel yang telah di-scan menjadi 1 file PDF (Maks 10MB).</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="formUploadSpj">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Pilih Kegiatan Rombongan (Surat
                                    Tugas)</label>
                                <select class="form-select" id="nomor_st" name="nomor_st" required>
                                    <option value="">-- Memuat daftar Surat Tugas... --</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">File PDF SPJ</label>
                                <input class="form-control" type="file" id="file_pdf"
                                    name="file_pdf" accept="application/pdf" required>
                                <small class="text-danger mt-1 d-block" id="errorSize"
                                    style="display:none;"><i
                                        class="bi bi-exclamation-triangle-fill"></i> Ukuran file
                                    melebihi 10MB!</small>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary rounded-pill fw-bold"
                                    id="btnSubmit">
                                    <i class="bi bi-send-fill me-1"></i> Kirim untuk Diverifikasi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h6 class="fw-bold text-secondary"><i class="bi bi-clock-history me-1"></i>
                            Status Verifikasi SPJ</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="px-4 py-3">Pelaksana & Kegiatan</th>
                                        <th class="text-center" width="15%">Status</th>
                                        <th class="text-center" width="15%">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelStatusUser">
                                    <tr class="skeleton-row">
                                        <td class="px-4 py-3">
                                            <div class="skeleton skeleton-line" style="width: 60%"></div>
                                            <div class="skeleton skeleton-line" style="width: 80%"></div>
                                            <div class="skeleton skeleton-line" style="width: 40%"></div>
                                        </td>
                                        <td class="text-center"><div class="skeleton skeleton-badge mx-auto"></div></td>
                                        <td class="text-center"><div class="skeleton skeleton-btn mx-auto"></div></td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td class="px-4 py-3">
                                            <div class="skeleton skeleton-line" style="width: 55%"></div>
                                            <div class="skeleton skeleton-line" style="width: 70%"></div>
                                            <div class="skeleton skeleton-line" style="width: 35%"></div>
                                        </td>
                                        <td class="text-center"><div class="skeleton skeleton-badge mx-auto"></div></td>
                                        <td class="text-center"><div class="skeleton skeleton-btn mx-auto"></div></td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td class="px-4 py-3">
                                            <div class="skeleton skeleton-line" style="width: 65%"></div>
                                            <div class="skeleton skeleton-line" style="width: 75%"></div>
                                            <div class="skeleton skeleton-line" style="width: 45%"></div>
                                        </td>
                                        <td class="text-center"><div class="skeleton skeleton-badge mx-auto"></div></td>
                                        <td class="text-center"><div class="skeleton skeleton-btn mx-auto"></div></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/upload-handler.js"></script>
    <script src="/js/load-components.js"></script>
</body>

</html>
