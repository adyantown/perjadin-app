<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Pegawai - KPU Tubaba</title>
    <link rel="icon" type="image/x-icon" href="/img/kpu_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style/index-style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-kpu py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-arrow-left-circle me-2"></i> Kembali ke Dashboard
            </a>
            <span class="text-white fw-bold">DATABASE PEGAWAI</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-secondary mb-0">Daftar Pegawai Satker</h5>
                    <button class="btn btn-success" onclick="bukaModalTambah()">
                        <i class="bi bi-person-plus-fill me-1"></i> Tambah Pegawai
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th width="5%">No</th>
                                <th width="30%">Nama & NIP</th>
                                <th width="20%">Jabatan</th>
                                <th width="20%">Pangkat/Gol (Kategori)</th>
                                <th width="15%" class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelPegawaiBody">
                            <tr>
                                <td colspan="5" class="text-center py-4">Sedang memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPegawai" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-kpu text-white">
                    <h5 class="modal-title" id="modalTitle">Tambah Pegawai Baru</h5>
                    <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
                </div>
                <form id="formPegawai">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="pegawaiId">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Kategori</label>
                                <select name="kategori" class="form-select" required>
                                    <option value="PNS">PNS</option>
                                    <option value="PPPK">PPPK</option>
                                    <option value="Komisioner">Komisioner</option>
                                </select>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nama Lengkap (Gelar)</label>
                                <input type="text" name="nama_pegawai" class="form-control"
                                    placeholder="Contoh: Fikriadi, S.IP." required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">NIP / NIK</label>
                                <input type="text" name="nip_nik" class="form-control"
                                    placeholder="Isi '-' jika tidak ada">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Jabatan</label>
                                <input type="text" name="jabatan" class="form-control"
                                    placeholder="Contoh: Kasubbag KUL" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Pangkat</label>
                                <input type="text" name="pangkat" class="form-control"
                                    placeholder="Contoh: Penata Muda">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Golongan</label>
                                <input type="text" name="golongan" class="form-control"
                                    placeholder="Contoh: III/a">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary bg-kpu border-0">Simpan Data
                            💾</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/pegawai-handler.js"></script>
</body>

</html>
